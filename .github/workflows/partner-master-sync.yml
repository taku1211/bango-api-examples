name: Partner master sync

on:
  pull_request:
    branches: [main, feat/issue645-partner-master-offline-example]
    paths:
      - 'examples/partner-master-sync/**'
      - '.github/workflows/partner-master-sync.yml'
  push:
    branches: [main]
    paths:
      - 'examples/partner-master-sync/**'
      - '.github/workflows/partner-master-sync.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Partner master sync (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: examples/partner-master-sync
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
